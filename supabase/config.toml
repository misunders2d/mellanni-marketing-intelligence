project_id = "mellanni-marketing-intelligence"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "https://mellanni-marketing-insights.vercel.app"
additional_redirect_urls = [
  "https://mellanni-marketing-insights.vercel.app/admin",
  "https://*-mellanni.vercel.app/**",
  "http://127.0.0.1:3000/**",
]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
