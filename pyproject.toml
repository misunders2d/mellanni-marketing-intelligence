[project]
name = "mellanni-marketing-intelligence"
version = "0.1.0"
description = "Programmatic weekly marketing-source collection into a local journal"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mellanni-marketing-intelligence = "mellanni_marketing_intelligence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
